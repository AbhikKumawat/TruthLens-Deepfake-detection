version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/truthlens.db:/app/truthlens.db
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./truthlens.db
      - SECRET_KEY=your-super-secret-key-keep-it-safe
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIR=uploads
      - REPORTS_DIR=reports
      - CORS_ORIGINS=["http://localhost:3000"]
      - APP_NAME=TruthLens
      - DEBUG=True

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
